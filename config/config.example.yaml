# 项目配置文件示例
# 复制此文件为 config.yaml 并填入实际配置

# API配置
api:
  deepseek:
    api_key: "your-deepseek-api-key-here"
    base_url: "https://api.deepseek.com"
    model: "deepseek-v4-pro"
    max_tokens: 4096
    max_prompt_tokens: 12000
    thinking: true  # 思考模式，DeepSeek V4 推荐开启
    reasoning_effort: "max"  # 思考强度: high(默认) / max(最大)

# DXF解析配置
dxf_parser:
  supported_versions:
    - "R12"
    - "R2000"
    - "R2004"
    - "R2007"
    - "R2010"
    - "R2013"
    - "R2018"
  extract_entities:
    - "LINE"
    - "CIRCLE"
    - "ARC"
    - "LWPOLYLINE"
    - "TEXT"
    - "MTEXT"
    - "ELLIPSE"
    - "SPLINE"
    - "DIMENSION"
    - "INSERT"
  libredwg_path: "D:\\Code\\libredwg-0.13.4.8160-win64"  # LibreDWG路径，用于DWG→DXF转换

# FreeCAD路径配置
# 系统会自动检测运行环境，选择合适的调用方式：
#   - direct 模式: 在 FreeCAD 自带 Python 中运行时直接导入
#   - subprocess 模式: 在系统 Python 中通过子进程调用 FreeCAD Python
freecad:
  bin_path: "D:\\FreeCAD 1.0\\bin"  # FreeCAD二进制文件目录（含 python.exe）
  script_timeout: 300  # 子进程模式下的脚本执行超时(秒)

# 3D建模配置
modeling:
  default_extrude_height: 10.0
  default_units: "mm"
  export_formats:
    - "STEP"
    - "STL"
    - "FCStd"

# 日志配置
logging:
  level: "INFO"
  file: "logs/app.log"
  max_bytes: 10485760
  backup_count: 5
