# 项目配置文件示例
# 复制此文件为 config.yaml 并填入实际配置

# API配置
# 实际 API Key 请在项目根目录的 .env 文件中设置 DEEPSEEK_API_KEY
api:
  deepseek:
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "https://api.deepseek.com"
    user_id: "cad-system-local"  # DeepSeek user_id，用于安全、调度和 KVCache 隔离；不要填个人隐私信息
    request_timeout_seconds: 300
    max_retries: 1  # 预留：仅对 429/5xx 等临时错误做有限重试
    retry_backoff_seconds: 2.0
    model: "deepseek-v4-pro"
    view_model: "deepseek-v4-pro"
    semantic_adjudication_model: "deepseek-v4-pro"
    semantic_model: "deepseek-v4-pro"
    # 可选：将前置图纸理解阶段切换到 Moonshot Kimi K2.6 多模态模型。
    # 后续零件语义生成和建模脚本生成仍默认使用上面的 DeepSeek 配置。
    # front_stage_api_key: "${MOONSHOT_API_KEY}"
    # front_stage_provider: "moonshot"
    # front_stage_base_url: "https://api.moonshot.cn/v1"
    # view_model: "kimi-k2.6"
    # semantic_adjudication_model: "kimi-k2.6"
    # enable_multimodal_front_stage_input: true
    # semantic_adjudication_max_images: 1
    max_tokens: 4096
    max_prompt_tokens: 12000
    semantic_max_tokens: 30000  # 语义生成阶段输出上限（默认 30000）
    reasoning_effort: "max"  # DeepSeek 当前支持 high/max
    stage_thinking:
      view_analysis:
        enabled: false
        reasoning_effort: "high"
      semantic_adjudication:
        enabled: false
        reasoning_effort: "high"
      semantic_generation:
        enabled: false
        reasoning_effort: "high"
      modeling_generation:
        enabled: false
        reasoning_effort: "max"

# DXF解析配置
dxf_parser:
  supported_versions:
    - "R12"
    - "R2000"
    - "R2004"
    - "R2007"
    - "R2010"
    - "R2013"
    - "R2018"
  extract_entities:
    - "LINE"
    - "CIRCLE"
    - "ARC"
    - "LWPOLYLINE"
    - "TEXT"
    - "MTEXT"
    - "ELLIPSE"
    - "SPLINE"
    - "DIMENSION"
    - "INSERT"
  libredwg_path: "${LIBREDWG_PATH}"  # LibreDWG路径（可选，项目已内置 tools/bin/dwg2dxf.exe）
  output_dir: "examples/output"  # 可视化图片默认输出目录
  # DIMENSION 文字补绘策略：
  #   auto: 仅补绘相对图幅过小、原生预览中容易不可见的尺寸文字
  #   true: 强制补绘所有 DIMENSION 匿名块文字
  #   false: 禁用补绘
  overlay_dimension_text: "auto"
  dimension_text_auto_overlay_ratio: 0.008
  dimension_text_auto_overlay_min_height: 1.5
  dimension_text_auto_overlay_fontsize: 10.0
  preview_annotation_color: 7  # 预览中统一文字/尺寸标注颜色，7 通常显示为白色

# FreeCAD路径配置
# 系统会自动检测运行环境，选择合适的调用方式：
#   - direct 模式: 在 FreeCAD 自带 Python 中运行时直接导入
#   - subprocess 模式: 在系统 Python 中通过子进程调用 FreeCAD Python
freecad:
  bin_path: "${FREECAD_BIN_PATH}"  # FreeCAD二进制文件目录，从 .env 读取
  script_timeout: 300

# 3D建模配置
modeling:
  default_extrude_height: 10.0  # 仅基础模式使用
  default_units: "mm"
  export_formats:
    - "STEP"
    - "STL"
    - "FCStd"

# 缓存配置
cache:
  enable: true
  cache_dir: ".cache/analysis"
  default_ttl: 604800

# 日志配置
logging:
  level: "INFO"
  file: "logs/app.log"
  max_bytes: 10485760
  backup_count: 5
