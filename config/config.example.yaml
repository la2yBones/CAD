# 项目配置文件示例
# 复制此文件为 config.yaml 并填入实际配置

# API配置
api:
  qwen:
    api_key: "your-dashscope-api-key-here"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen3.6-plus"
    temperature: 0.3
    max_tokens: 4096

# DXF解析配置
dxf_parser:
  supported_versions:
    - "R12"
    - "R2000"
    - "R2004"
    - "R2007"
    - "R2010"
    - "R2013"
    - "R2018"
  extract_entities:
    - "LINE"
    - "CIRCLE"
    - "ARC"
    - "LWPOLYLINE"
    - "TEXT"
    - "MTEXT"
  oda_converter_path: ""  # ODA File Converter路径（可选）
  libredwg_path: "D:\\Code\\libredwg-0.13.4.8160-win64"  # LibreDWG路径，用于DWG→DXF转换
  dwg_converter: "libredwg"  # 可选: "libredwg" 或 "oda"

# FreeCAD路径配置
freecad:
  bin_path: "D:\\FreeCAD 1.0\\bin"  # FreeCAD二进制文件目录

# 3D建模配置
modeling:
  default_extrude_height: 10.0
  default_units: "mm"
  export_formats:
    - "STEP"
    - "STL"
    - "FCStd"

# 日志配置
logging:
  level: "INFO"
  file: "logs/app.log"
  max_bytes: 10485760
  backup_count: 5
