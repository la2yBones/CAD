[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-3d-modeler"
version = "1.0.0"
description = "CAD drawing automatic 3D modeling system for DXF/DWG analysis and STEP/STL generation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "CAD Project Team" }
]
keywords = ["cad", "dxf", "dwg", "3d-modeling", "freecad", "deepseek", "step", "stl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "ezdxf>=1.4.3,<2.0",
    "openai>=1.0,<3.0",
    "shapely>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "json5>=0.9,<1.0",
    "matplotlib>=3.7,<4.0",
    "numpy>=1.24,<3.0",
    "scikit-learn>=1.3,<2.0",
    "typing-extensions>=4.5,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=4.0,<7.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.0,<2.0",
    "black>=23.0,<26.0",
    "flake8>=6.0,<8.0",
]

[project.scripts]
cad-modeler = "cad_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "examples*", "docs*", "thesis*"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["thesis/", "docs/", ".cache/", "examples/output/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
exclude = ["thesis/", "docs/", "examples/", ".cache/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "examples/*", "docs/*"]
